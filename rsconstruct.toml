# rsconstruct build configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["scripts", "config"]

[processor.pylint]
src_dirs = ["scripts", "config"]

[processor.mypy]
src_dirs = ["scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── repo-specific configuration ────────────────────────────────────────────

# The Makefile drove Kbuild for the C parts, compiled the C++ parts with g++
# using flags derived from the kernel's, and relinked the module to include
# them. Kbuild (the file) now carries the module description with the C++
# objects as prebuilt members, and scripts/build_kcpp.py compiles them and
# runs Kbuild, which does the linking itself. The Makefile's
# insmod/rmmod/log targets were operational helpers, not build steps.
[processor.explicit.kcpp]
command = "scripts/build_kcpp.py"
inputs = ["Kbuild", "scripts/build_kcpp.py", "scripts/process_flags.py"]
input_globs = ["*.c", "*.cc", "*.h"]
output_files = ["kcpp.ko", "flags.cfg"]

# the module is compiled against kernel headers; on a CI runner that has no
# headers for its own kernel the generic package supplies a build tree
[dependencies]
system = ["linux-headers-generic"]

# the Makefile also ran the kernel's checkpatch.pl over the C sources
[processor.checkpatch]
src_dirs = ["."]
src_extensions = [".c"]
# kcpp.mod.c is generated by Kbuild; std_module is the flag-analysis sample
src_exclude_paths = ["kcpp.mod.c"]
src_exclude_dirs = ["std_module"]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
